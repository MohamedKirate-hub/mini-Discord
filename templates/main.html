<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevRooms</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Navbar Layout */
        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Nav Brand / Home Link */
        nav > a[href*="home"], nav > a:first-child {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.02em;
            transition: color 0.2s ease;
        }

        nav > a[href*="home"]:hover, nav > a:first-child:hover {
            color: var(--accent);
        }

        /* Nav Search Bar */
        nav form {
            flex: 1;
            max-width: 450px;
        }

        nav form input[type="text"] {
            width: 100%;
            padding: 0.5rem 1rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        nav form input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        nav form input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        /* Right Nav Links */
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* Primary Action Accent Link (Login/Profile) */
        nav a[href*="profile"], nav a[href*="login"] {
            color: var(--accent);
            font-weight: 600;
        }

        nav a[href*="profile"]:hover, nav a[href*="login"]:hover {
            color: var(--accent-hover);
        }

        /* Responsive Navbar */
        @media (max-width: 640px) {
            nav {
                padding: 0.8rem 1rem;
                gap: 0.75rem;
            }

            nav form {
                max-width: 180px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'navbar.html' %}

    {% block content %}
    {% endblock %}
</body>
</html>
