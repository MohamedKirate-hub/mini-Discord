{% extends 'main.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/update_room.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2 class="form-title">Update Room</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a href="{% url 'home' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">Update Room</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
