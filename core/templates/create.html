{% extends 'main.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/create.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2 class="form-title">Create New</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a href="{{ request.META.HTTP_REFERER }}" class="btn-cancel">Go Back</a>
                <button type="submit" class="btn-submit">Create</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
