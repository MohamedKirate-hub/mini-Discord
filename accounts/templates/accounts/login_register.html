{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page == "login" %}Login{% else %}Register{% endif %}</title>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
    {% if page == "login" %}
    <form method="post">
        <h2>Welcome back</h2>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
        <a href="{% url 'register' %}">I don't have an account yet.</a>
    </form>
    {% else %}
    <form method="post">
        <h2>Create account</h2>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
        <a href="{% url 'login' %}">I already have an account.</a>
    </form>
    {% endif %}
</body>
</html>
